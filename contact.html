<!DOCTYPE html>
<!-- Contact Me page of my portfolio website -->
<html lang="en">
<head>
    <!-- UTF-8 supports all letters, numbers and symbols -->
    <meta charset="UTF-8">
    <!-- Makes phones and tablets report their real width so the media queries work -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me | Aarush Prakash</title>
    <!-- Main stylesheet with the colours and fonts used on every page -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Media queries: each stylesheet below is only used when the screen width matches -->
    <!-- Phone stylesheet: screens 480px wide or smaller -->
    <link rel="stylesheet" href="css/mobile.css" media="only screen and (max-width: 480px)">
    <!-- Tablet stylesheet: screens from 481px to 960px wide -->
    <link rel="stylesheet" href="css/tablet.css" media="only screen and (min-width: 481px) and (max-width: 960px)">
    <!-- Laptop stylesheet: screens 961px wide or bigger -->
    <link rel="stylesheet" href="css/laptop.css" media="only screen and (min-width: 961px)">
</head>
<body>

    <!-- Header holds my name and the main navigation (same on every page) -->
    <header>
        <h1>Aarush Prakash</h1>
        <p>Technology Management for IT Student</p>

        <!-- Navigation links to all four pages -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a class="current" href="contact.html">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main holds the content that is different on each page -->
    <main>

        <!-- Contact section: holds the contact form -->
        <section id="contact">
            <h2>Contact Me</h2>
            <p>Send me your questions, comments and project related queries! All fields are required.</p>

            <!-- The mailto action opens the visitor's email program with the form data in the message.
                 method="post" sends the data, enctype="text/plain" sends it as normal text. -->
            <form action="mailto:aarush.prakash@ontariotechu.net" method="post" enctype="text/plain">

                <!-- Each label's "for" matches its input's "id" so screen readers know which label goes with which box -->
                <!-- required: the form cannot be sent if this box is empty. minlength: at least 2 letters. -->
                <p>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="First and last name" minlength="2" required>
                </p>

                <!-- type="email" makes the browser check that the value looks like an email (has an @) -->
                <p>
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </p>

                <!-- type="tel" shows a number keypad on phones.
                     pattern means: 3 digits, a dash, 3 digits, a dash, 4 digits. title explains the format. -->
                <p>
                    <label for="phone">Cell Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="905-555-1234"
                        pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Use the format 905-555-1234" required>
                </p>

                <!-- textarea allows many lines of text. maxlength stops the message at 500 characters. -->
                <p>
                    <label for="comments">Comments</label>
                    <textarea id="comments" name="comments" rows="6" maxlength="500"
                        placeholder="Question, comment or query..." required></textarea>
                </p>

                <!-- type="number" only accepts numbers. min and max are both 4, so 4 is the only correct answer. -->
                <p>
                    <label for="robot">What is 2 + 2? (So I know you are not a robot)</label>
                    <input type="number" id="robot" name="robot" min="4" max="4" required>
                </p>

                <!-- submit sends the form, reset clears all the boxes -->
                <p>
                    <input class="form-button" type="submit" value="Submit">
                    <input class="form-button" type="reset" value="Reset">
                </p>

            </form>
        </section>

    </main>

    <!-- Footer holds my contact email and copyright (same on every page) -->
    <footer>
        <address>
            Email: <a href="mailto:aarush.prakash@ontariotechu.net">aarush.prakash@ontariotechu.net</a>
        </address>
        <p>&copy; 2026 Aarush Prakash. All rights reserved.</p>
    </footer>

</body>
</html>
